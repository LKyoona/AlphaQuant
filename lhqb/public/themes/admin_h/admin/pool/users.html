<include file="public@header" />
</head>

<body class="gray-bg">
    <div class="wrapper wrapper-content animated fadeInUp js-check-wrap">
        <div class="row">
            <div class="col-sm-12">
                <div class="ibox float-e-margins">
                    <div class="ibox-title">
                        <h5>合伙人列表</h5>
                        <div class="ibox-tools">
                            <a href="#" class="btn btn-primary btn-xs active">合伙人列表</a>
                        </div>
                    </div>
                    <div class="ibox-content">
                        <form class="well form-inline margin-top-20" method="post" action="{:url('pool/users')}">
                            用户ID：
                            <input class="form-control" type="text" name="user_id" style="width: 200px;"
                                value="{:input('request.user_id')}" placeholder="请输入用户ID,如:800001">

                            <input type="submit" class="btn btn-primary" value="搜索" />
                            <a class="btn btn-danger" href="{:url('pool/users')}">清空</a>
                            <br>
                            <br>
                            <span>月度池余额:{$pool_1_balance}</span>
                            <br>
                            <br>
                            <span>年度池余额:{$pool_2_balance}</span>
                        </form>

                        <table class="table table-hover" id="menus-table">
                            <thead>
                                <tr>
                                    <th width="100">用户ID</th>
                                    <th>电话</th>
                                </tr>
                            </thead>
                            <tbody>
                                <eq name="datas" value="">
                                    <tr>
                                        <td colspan="5" style="text-align: center">暂无数据</td>
                                    </tr>
                                    <else />
                                    <foreach name="datas" item="vo">
                                        <tr>
                                            <td>{$vo.id} </td>
                                            <td>{$vo.mobile} </td>

                                        </tr>
                                    </foreach>
                                </eq>
                            </tbody>
                        </table>
                        <div class="pagination">
                            <div>
                                当前共有数据 <span style="color:blue;font-weight:bold">{$num}</span> 条
                            </div>
                            {$page|default=''}

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <script src="__STATIC__/js/admin.js"></script>

</body>

</html>
