<include file="public@header" />
</head>

<body class="gray-bg">
    <div class="wrapper wrapper-content animated fadeInUp js-check-wrap">
        <div class="row">
            <div class="col-sm-12">
                <div class="ibox float-e-margins">
                    <div class="ibox-title">
                        <h5>添加激活码</h5>
                        <div class="ibox-tools">
                            <a href="{:url('Cdkey/index')}" class="btn btn-primary btn-xs active">激活码列表</a>
                            <a href="{:url('Cdkey/add')}" class="btn btn-primary btn-xs">添加激活码</a>
                        </div>
                    </div>
                    <div class="ibox-content">
                        <form class="form-horizontal js-ajax-form" action="{:url('Cdkey/add')}" method="post">


                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span class="form-required">*</span>备注</label>
                                <div class="col-sm-6">
                                    <input type="text" class="form-control" id="input-memo" name="memo" value="">
                                </div>
                            </div>
                            <div class="hr-line-dashed">
                            </div>


                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span
                                        class="form-required">*</span>生成激活码数量</label>
                                <div class="col-sm-6">
                                    <input type="text" class="form-control" id="input-num" name="num" value="">
                                </div>
                            </div>
                            <div class="hr-line-dashed">
                            </div>

                            <div class="form-group">
                                <div class="col-sm-offset-2 col-sm-6">
                                    <button type="submit" class="btn btn-primary js-ajax-submit">{:lang('ADD')}</button>
                                    <a class="btn btn-default" href="javascript:history.back(-1);">{:lang('BACK')}</a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="__STATIC__/js/admin.js"></script>
