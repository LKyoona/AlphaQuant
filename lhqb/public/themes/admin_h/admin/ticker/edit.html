<include file="public@header"/>
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInUp js-check-wrap">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>编辑</h5>
                    <div class="ibox-tools">
                        <a href="{:url('Ticker/index')}" class="btn btn-primary btn-xs active">行情市场列表</a>
                        <a href="{:url('Ticker/add')}" class="btn btn-primary btn-xs">编辑行情</a>
                    </div>
                </div>
                <div class="ibox-content">
                    <form class="form-horizontal js-ajax-form" action="{:url('Ticker/editpost')}" method="post">

                        <div class="form-group">
                            <label class="col-sm-2 control-label"><span class="form-required">*</span>交易所名字</label>
                            <div class="col-sm-6">
                                <input type="text" class="form-control" id="input-exchange_name" name="exchange_name" required="required" value="{$data.exchange_name}">
                                <input type="hidden" name="id" value="{$data.id}">
                            </div>
                        </div>
                        <div class="hr-line-dashed">
                        </div>

                        <div class="form-group">
                            <label class="col-sm-2 control-label"><span class="form-required">*</span>交易所采集类</label>
                            <div class="col-sm-6">
                                <input type="text" class="form-control" id="input-exchange_class" name="exchange_class" required="required" value="{$data.exchange_class}">
                            </div>
                        </div>
                        <div class="hr-line-dashed">
                        </div>

                        <div class="form-group">
                            <label class="col-sm-2 control-label"><span class="form-required">*</span>市场名称</label>
                            <div class="col-sm-6">
                                <input type="text" class="form-control" id="input-market" name="market" required="required" value="{$data.market}">
                            </div>
                        </div>
                        <div class="hr-line-dashed">
                        </div>

                        <div class="form-group">
                            <label class="col-sm-2 control-label"><span class="form-required">*</span>币种</label>
                            <div class="col-sm-6">
                                <select  class="form-control" name="coin" >
                                    <foreach name="coin" item="vo">
                                        <option value="{$vo}" <eq name="data.coin" value="$vo">selected</eq>>{$vo}</option>
                                    </foreach>
                                </select>
                            </div>
                        </div>
                        <div class="hr-line-dashed">
                        </div>
        
                        <div class="form-group">
                            <label class="col-sm-2 control-label"><span class="form-required">*</span>货币</label>
                            <div class="col-sm-6">
                                <input type="text" class="form-control" id="input-currency" name="currency" required="required" value="{$data.currency}">
                            </div>
                        </div>
                        <div class="hr-line-dashed">
                        </div>

                        <div class="form-group">
                            <label class="col-sm-2 control-label"><span class="form-required">*</span>交易量</label>
                            <div class="col-sm-6">
                                <input type="text" class="form-control" id="input-volume" name="volume" required="required" value="{$data.volume}">
                            </div>
                        </div>
                        <div class="hr-line-dashed">
                        </div>

                        <div class="form-group">
                            <label class="col-sm-2 control-label"><span class="form-required">*</span>价格</label>
                            <div class="col-sm-6">
                                <input type="text" class="form-control" id="input-price" name="price" required="required" value="{$data.price}">
                            </div>
                        </div>
                        <div class="hr-line-dashed">
                        </div>

                        <div class="form-group">
                            <label class="col-sm-2 control-label"><span class="form-required">*</span>涨幅</label>
                            <div class="col-sm-6">
                                <input type="text" class="form-control" id="input-change" name="change" required="required" value="{$data.change}">
                            </div>
                        </div>
                        <div class="hr-line-dashed">
                        </div>
            
                        <div class="form-group">
                                <label class="col-sm-2 control-label"><span class="form-required">*</span>是否默认显示</label>
                                <div class="col-sm-6">
                                    <input name="default" value="1" type="radio" 
                                    <eq name="data.default" value="1">checked</eq>
                                      >是 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                                    <input name="default" value="0" type="radio" 
                                    <eq name="data.default" value="0">checked</eq>
                                    >否
                                </div>
                            </div>
                            <div class="hr-line-dashed">
                            </div>

                        <div class="form-group">
                            <div class="col-sm-offset-2 col-sm-6">
                                <button type="submit" class="btn btn-primary js-ajax-submit">{:lang('EDIT')}</button>
                                <a class="btn btn-default" href="javascript:history.back(-1);">{:lang('BACK')}</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
    <script src="__STATIC__/js/admin.js"></script>
    </body>
    </html>
