<include file="public@header"/>
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInUp js-check-wrap">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>添加商品</h5>
                    <div class="ibox-tools">
                        <a href="{:url('Shop/index')}" class="btn btn-primary btn-xs active">商品列表</a>
                        <a href="{:url('Shop/add')}" class="btn btn-primary btn-xs">添加商品</a>
                    </div>
                </div>
                <div class="ibox-content">
                    <form class="form-horizontal js-ajax-form" action="{:url('Shop/add')}" method="post">

                        <div class="form-group">
                            <label class="col-sm-2 control-label"><span class="form-required">*</span>商品名称</label>
                            <div class="col-sm-6">
                                <input type="text" class="form-control" id="input-good_title" name="good_title" value="" required="required">
                            </div>
                        </div>
                        <div class="hr-line-dashed">
                        </div>

                        <div class="form-group">
                            <label class="col-sm-2 control-label"><span class="form-required">*</span>商品标题</label>
                            <div class="col-sm-6">
                                <input type="text" class="form-control" id="input-good_description" name="good_description" value="" required="required">
                            </div>
                        </div>
                        <div class="hr-line-dashed">
                        </div>

                        <div class="form-group">
                            <label class="col-sm-2 control-label"><span class="form-required">*</span>商品详情</label>
                            <div class="col-sm-6">
                                <input type="text" class="form-control" id="input-good_info" name="good_info" value="" required="required">
                            </div>
                        </div>
                        <div class="hr-line-dashed">
                        </div>


                        <div class="form-group">
                            <label class="col-sm-2 control-label"><span class="form-required">*</span>币种符号</label>
                            <div class="col-sm-6">
                                <input type="text" class="form-control" id="input-coin_symbol" name="coin_symbol" value="" required="required">
                            </div>
                        </div>
                        <div class="hr-line-dashed">
                        </div>


                        <div class="form-group">
                            <label class="col-sm-2 control-label"><span class="form-required">*</span>兑换汇率</label>
                            <div class="col-sm-6">
                                <input type="text" class="form-control" id="input-exchange_rate" size=20 name="exchange_rate" value=''>
                            </div>
                        </div>
                        <div class="hr-line-dashed">
                        </div>

                        <div class="form-group">
                            <label class="col-sm-2 control-label"><span class="form-required">*</span>总额度</label>
                            <div class="col-sm-6">
                                <input type="text" class="form-control" id="input-total_amount" name="total_amount" value=''>
                            </div>
                        </div>
                        <div class="hr-line-dashed">
                        </div>

                        <div class="form-group">
                            <label class="col-sm-2 control-label"><span class="form-required">*</span>剩余额度</label>
                            <div class="col-sm-6">
                                <input type="text" class="form-control" id="input-left_amount" name="left_amount" value="">
                            </div>
                        </div>
                        <div class="hr-line-dashed">
                        </div>

                        <div class="form-group">
                            <label class="col-sm-2 control-label"><span class="form-required">*</span>单人积分兑换额度</label>
                            <div class="col-sm-6">
                                <input type="text" class="form-control" id="input-single_user_amount" name="single_user_amount" value="">
                            </div>
                        </div>
                        <div class="hr-line-dashed">
                        </div>


                        <div class="form-group">
                            <label class="col-sm-2 control-label"><span class="form-required">*</span>参与人数</label>
                            <div class="col-sm-6">
                                <input type="text" class="form-control" id="input-join_num" name="join_num" value="">
                            </div>
                        </div>
                        <div class="hr-line-dashed">
                        </div>

                        <div id = "show_token">

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span class="form-required"></span>开始时间</label>
                                <div class="col-sm-6">
                                    <input type="text" class="form-control" id="input-start_time" name="start_time" value="">
                                </div>
                            </div>
                            <div class="hr-line-dashed">
                            </div>

                            <div class="form-group">
                                <label class="col-sm-2 control-label"><span class="form-required"></span>结束时间</label>
                                <div class="col-sm-6">
                                    <input type="text" class="form-control" id="input-end_time" name="end_time" value="">
                                </div>
                            </div>
                            <div class="hr-line-dashed">
                            </div>

                        </div>
                        <div class="form-group">
                            <div class="col-sm-offset-2 col-sm-6">
                                <button type="submit" class="btn btn-primary js-ajax-submit">{:lang('ADD')}</button>
                                <a class="btn btn-default" href="javascript:history.back(-1);">{:lang('BACK')}</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
    <script src="__STATIC__/js/admin.js"></script>
    <script>
    </body>
    </html>
