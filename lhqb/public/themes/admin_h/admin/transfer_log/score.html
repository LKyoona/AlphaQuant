<include file="public@header"/>
</head>
<body class="gray-bg">
    <div class="wrapper wrapper-content animated fadeInUp js-check-wrap">
        <div class="row">
            <div class="col-sm-12">
                <div class="ibox float-e-margins">
                    <div class="ibox-title">
                        <h5>积分记录</h5>
                        <div class="ibox-tools">
                            <a href="#" class="btn btn-primary btn-xs active">积分记录</a>
                        </div>
                    </div>
<div class="ibox-content">
    <form class="well form-inline margin-top-20" method="post" action="{:url('TransferLog/index')}">

        开始时间：
        <input class="form-control js-bootstrap-datetime" type="text" name="start_time" style="width: 200px;" value="{:input('request.start_time')}"
                placeholder="请输入开始时间">

        结束时间：
        <input class="form-control js-bootstrap-datetime" type="text" name="end_time" style="width: 200px;" value="{:input('request.end_time')}"
                placeholder="请输入结束时间">

                
        用户：
        <input class="form-control" type="text" name="uid" style="width: 200px;" value="{:input('request.uid')}"
                placeholder="请输入用户ID,如:800001">

        <br>
        <br>
        <input type="submit" class="btn btn-primary" value="搜索"/>
        <a class="btn btn-danger" href="{:url('TransferLog/index')}">清空</a>

        <br><br>当前检索结果 总数量: <span style="color:red">{$total_amount}</span>

    </form>

        <table class="table table-hover" id="menus-table">
            <thead>
                <tr>
                    <th width="60">ID</th>
                    <th width="100">发送用户ID</th>
                    <th>用户</th>
                    <th>改变金额</th>
                    <th>改变后余额</th>
                    <th>时间</th>
                    <th>备注</th>
                </tr>
            </thead>
            <tbody>
                <eq name="datas" value="">
                        <tr> 
                            <td colspan="5" style="text-align: center">暂无数据</td>
                        </tr>
                <else />
                    <foreach name="datas" item="vo">
                        <tr>
                            <td> {$vo.id} </td>
                            <td> {$vo.user_id} </td>
                            <td>{$vo.uname} </td>
                    
                            <td>{$vo.change|floatval}</td>
                            <td>{$vo.amount|floatval}</td>

                            <td>{$vo.ctime|date="Y-m-d H:i",###}</td>
                            <td>{$vo.extension}</td>
                    
                        </tr>
                    </foreach>
            </eq>
            </tbody>
        </table>




    
    <div class="pagination">
            <div>
                当前共有数据 <span style="color:blue;font-weight:bold">{$num}</span> 条
            </div>
            {$page|default=''}
        
    </div>
</div>

                    </div>
                </div>
        </div>
    </div>
<script src="__STATIC__/js/admin.js"></script>

</body>
</html>
